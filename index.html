<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web-2 Login</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            background:
                radial-gradient(circle at top, #172554 0%, #020617 48%, #000 100%);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .container {
            width: 460px;
            max-width: 100%;
        }

        .card {
            background: rgba(15, 23, 42, 0.94);
            border: 1px solid #334155;
            border-radius: 26px;
            padding: 34px;
            box-shadow: 0 30px 90px rgba(0, 0, 0, 0.55);
            backdrop-filter: blur(12px);
        }

        .logo {
            width: 72px;
            height: 72px;
            margin: 0 auto 20px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #2563eb;
            font-size: 34px;
            font-weight: 800;
            box-shadow: 0 14px 35px rgba(37, 99, 235, 0.35);
        }

        h1 {
            margin: 0;
            text-align: center;
            font-size: 30px;
        }

        .subtitle {
            margin: 10px 0 28px;
            text-align: center;
            color: #94a3b8;
            line-height: 1.5;
        }

        .login-button {
            width: 100%;
            min-height: 52px;
            margin-top: 12px;
            border: 1px solid #475569;
            border-radius: 13px;
            background: #1e293b;
            color: #fff;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: transform .15s ease, background .15s ease, border-color .15s ease;
        }

        .login-button:hover {
            transform: translateY(-1px);
            background: #263449;
            border-color: #64748b;
        }

        .google {
            background: #fff;
            color: #111827;
            border-color: #fff;
        }

        .google:hover {
            background: #f1f5f9;
            border-color: #f1f5f9;
        }

        .email {
            background: #2563eb;
            border-color: #2563eb;
        }

        .email:hover {
            background: #1d4ed8;
            border-color: #1d4ed8;
        }

        .icon {
            display: inline-block;
            width: 28px;
            margin-right: 8px;
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 22px 0 8px;
            color: #64748b;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .divider::before,
        .divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: #334155;
        }

        .security-note {
            margin-top: 22px;
            padding: 13px 14px;
            border: 1px solid #334155;
            border-radius: 12px;
            background: rgba(2, 6, 23, .45);
            color: #94a3b8;
            text-align: center;
            font-size: 12px;
            line-height: 1.45;
        }

        .email-flow {
            margin-top: 17px;
            text-align: center;
            color: #64748b;
            font-size: 12px;
        }
    </style>
</head>

<body>

<div class="container">
    <section class="card">

        <div class="logo">W2</div>

        <h1>Welcome to Web-2</h1>

        <p class="subtitle">
            Sign in to continue to your Web-2 account.
        </p>

        <!-- Existing Google login -->
        <button class="login-button google"
                onclick="window.location.href='/login/google'">
            <span class="icon">G</span>
            Continue with Google
        </button>

        <!-- Existing Discord login -->
        <button class="login-button"
                onclick="window.location.href='/login/discord'">
            <span class="icon">🎮</span>
            Continue with Discord
        </button>

        <!-- Existing Microsoft option -->
        <button class="login-button"
                onclick="window.location.href='/login/microsoft'">
            <span class="icon">▦</span>
            Continue with Microsoft
        </button>

        <div class="divider">or</div>

        <!-- NEW email/password option -->
        <button class="login-button email"
                onclick="window.location.href='/login'">
            <span class="icon">✉</span>
            Continue with Email
        </button>

        <div class="email-flow">
            Continue with Email → Email & Password → Login
        </div>

        <div class="security-note">
            Your Web-2 password is stored as a secure password hash.
            Provider passwords such as Google or Discord passwords are never collected.
        </div>

    </section>
</div>

</body>
</html>
