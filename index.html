<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Web-2 | Login</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background:
                radial-gradient(circle at top left, #1e3a8a, transparent 35%),
                radial-gradient(circle at bottom right, #581c87, transparent 35%),
                #020617;

            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-box {
            width: 420px;
            max-width: 92%;
            padding: 40px;

            background: rgba(15, 23, 42, 0.95);
            border: 1px solid #334155;
            border-radius: 24px;

            box-shadow:
                0 25px 80px rgba(0, 0, 0, 0.6);

            text-align: center;
        }

        .logo {
            width: 75px;
            height: 75px;

            margin: 0 auto 20px;

            border-radius: 20px;

            display: flex;
            justify-content: center;
            align-items: center;

            background: linear-gradient(135deg, #2563eb, #7c3aed);

            font-size: 32px;
            font-weight: bold;

            box-shadow: 0 10px 35px rgba(37, 99, 235, 0.4);
        }

        h1 {
            margin: 0;
            font-size: 30px;
        }

        .subtitle {
            margin: 10px 0 30px;
            color: #94a3b8;
        }

        .login-button {
            width: 100%;
            height: 55px;

            margin-top: 14px;

            border: 1px solid #475569;
            border-radius: 12px;

            background: #1e293b;
            color: white;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;

            transition: 0.2s;
        }

        .login-button:hover {
            transform: translateY(-2px);
            background: #334155;
        }

        .google:hover {
            border-color: #4285f4;
        }

        .discord:hover {
            border-color: #5865f2;
        }

        .microsoft:hover {
            border-color: #00a4ef;
        }

        .icon {
            margin-right: 10px;
            font-size: 20px;
        }

        .footer {
            margin-top: 25px;
            color: #64748b;
            font-size: 13px;
        }
    </style>
</head>

<body>

    <div class="login-box">

        <div class="logo">
            W
        </div>

        <h1>Welcome</h1>

        <p class="subtitle">
            Sign in to continue to Web-2
        </p>

        <button class="login-button google" onclick="login('Google')">
            <span class="icon">G</span>
            Continue with Google
        </button>

        <button class="login-button discord" onclick="login('Discord')">
            <span class="icon">◈</span>
            Continue with Discord
        </button>

        <button class="login-button microsoft" onclick="login('Microsoft')">
            <span class="icon">▦</span>
            Continue with Microsoft
        </button>

        <div class="footer">
            Web-2 Authentication
        </div>

    </div>

    <script>
    function login(provider) {
        window.location.href = "/login/" + provider.toLowerCase();
    }
</script>

</body>
</html>
